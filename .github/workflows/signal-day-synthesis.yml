name: Signal Day Synthesis

# Nightly synthesis of qualitative signal observations into one daily verdict per signal.
# Runs at 01:00 UTC daily (after all time zones have finished the previous calendar day).

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  synthesize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run signal day synthesis
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
        run: |
          npx tsx scripts/synthesize-signal-day.ts
