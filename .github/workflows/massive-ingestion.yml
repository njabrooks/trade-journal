name: Massive Underlyings Ingestion

# Runs on remote Supabase via GitHub Actions
# Local Mac Mini launchd jobs should be disabled when this is active

on:
  schedule:
    # Run daily at 9:30 PM UTC (4:30 PM ET, 30 minutes after market close)
    - cron: '30 21 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Massive ingestion
        env:
          # Database connection
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          
          # Massive.com API credentials
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
        run: |
          npx tsx scripts/ingest-underlyings-massive.ts

