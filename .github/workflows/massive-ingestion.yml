name: Massive Underlyings Ingestion

on:
  schedule:
    # Run daily at 4:30 PM ET / 8:30 PM UTC (30 minutes after market close)
    # This captures end-of-day prices and IV data as soon as it's available
    # 
    # Timing considerations:
    # - Market closes at 4:00 PM ET
    # - Daily Market Summary returns normal close (4 PM), not after-hours
    # - Free tier cannot fetch today's data before market close
    # - EOD data is finalized ~4:05-4:15 PM ET (safe to assume by 4:30 PM)
    # - Options chain snapshot can be fetched after close (EOD prices)
    #
    # Running at 4:30 PM ET ensures:
    # - EOD data is available (after 4:15 PM finalization)
    # - Data arrives BEFORE Flex ingestion runs (Flex runs every 6 hours: 12 AM, 6 AM, 12 PM, 6 PM)
    # - State codes computed during Flex ingestion will have latest IV data
    # - Triage computed after Flex will have complete data
    - cron: '30 20 * * *'  # 4:30 PM ET (8:30 PM UTC during DST, 9:30 PM UTC standard time)
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Massive ingestion
        env:
          # Database connection
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          
          # Massive.com API credentials
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
        run: |
          npx tsx scripts/ingest-underlyings-massive.ts

