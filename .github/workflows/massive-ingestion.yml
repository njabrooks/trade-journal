name: Massive Underlyings Ingestion (DISABLED - Using Local Mac Mini)

# DISABLED: Ingestion now runs locally on Mac Mini via launchd
# This workflow is kept for emergency use only (manual trigger)
# See launchd/install.sh for local setup

on:
  # schedule:
  #   # Run daily at 4:30 PM ET / 8:30 PM UTC (30 minutes after market close)
  #   - cron: '30 20 * * *'
  workflow_dispatch: # Manual trigger only (emergency backup)

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Massive ingestion
        env:
          # Database connection
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          
          # Massive.com API credentials
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
        run: |
          npx tsx scripts/ingest-underlyings-massive.ts

