name: Price Gap Check

# Checks for market-tier assets missing recent prices.
# Runs after the morning flex ingestion completes (~07:00-07:45 UTC),
# so equity prices from extract-ibkr-prices.ts are available.
# Individual gaps → ::warning:: annotations. Only fails when freshness <80%.

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC — after flex ingestion + price extraction
  workflow_dispatch: # Manual trigger for testing

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check price gaps
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
        run: npx tsx scripts/check-price-gaps.ts
