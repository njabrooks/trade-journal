name: Options Scanner

# Primary schedule lives on the Mac Mini home hub as a launchd job
# (`launchd/com.trade-journal.options-scanner.plist`, 14:50 London local =
# 09:50 NYC year-round). The launchd cron replaced the GitHub Actions
# schedule because GH Actions cron consistently delayed this slot by 1.5-3h
# and skipped it entirely on busy days — see status.md (2026-05-18 entry).
#
# This workflow is kept as a manual fallback only: trigger via `gh workflow
# run options-scanner.yml` (or the Actions UI) when the Mac Mini is offline
# or you need a clean cloud rerun.
# Idempotent: scanner upserts on (run_date, universe_source); chain ingest
# upserts on the options_chain_snapshots composite uniqueness key.
#
# (The TS script retains the legacy `scan-cheap-options.ts` filename even
# though it screens both cheap and rich regimes; renaming was scoped out of
# the 2026-05-18 cleanup to limit blast radius.)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest radar back-month chains
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
        run: npx tsx scripts/ingest-radar-back-months.ts

      - name: Scan options (cheap + rich regimes)
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
        run: npx tsx scripts/scan-cheap-options.ts
