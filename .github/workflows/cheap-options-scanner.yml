name: Cheap Options Scanner

# Runs the radar back-month chain ingest + daily cheap-options scan on the
# watchlist universe. Two cron entries absorb the DST offset:
#   - 13:45 UTC = 14:45 BST (summer, EDT = 09:45 ET)
#   - 14:45 UTC = 14:45 GMT (winter, EST = 09:45 ET)
# Runs ~15 min after NYC open so the opening auction has cleared.
# Idempotent: the scanner upserts on (run_date, universe_source); the
# chain ingest upserts on the composite uniqueness key of options_chain_snapshots.

on:
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest radar back-month chains
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
        run: npx tsx scripts/ingest-radar-back-months.ts

      - name: Scan for cheap options
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
        run: npx tsx scripts/scan-cheap-options.ts
