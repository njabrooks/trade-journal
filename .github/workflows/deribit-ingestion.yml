name: Deribit Ingestion

on:
  schedule:
    # Every 4 hours at :45 past the hour (offset from HL at :00, CBP at :15, Kraken at :30)
    - cron: '45 */4 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Deribit ingestion
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          DERIBIT_CLIENT_ID: ${{ secrets.DERIBIT_CLIENT_ID }}
          DERIBIT_CLIENT_SECRET: ${{ secrets.DERIBIT_CLIENT_SECRET }}
        run: npx tsx scripts/ingest-deribit.ts
