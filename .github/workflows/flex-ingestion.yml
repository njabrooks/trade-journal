name: Flex Ingestion

# Runs on remote Supabase via GitHub Actions
# Local Mac Mini launchd jobs should be disabled when this is active

on:
  schedule:
    # Run hourly from 4 AM to 2 PM UTC (cover US market hours with buffer)
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
        run: |
          echo "DATABASE_URL_POOLER is set: $([[ -n "$DATABASE_URL_POOLER" ]] && echo 'YES' || echo 'NO')"
          echo "URL length: ${#DATABASE_URL_POOLER}"
          echo "URL starts with: ${DATABASE_URL_POOLER:0:30}..."
          echo "URL contains db.wvukk: $([[ "$DATABASE_URL_POOLER" == *"db.wvukk"* ]] && echo 'YES' || echo 'NO')"

      - name: Test raw database connection
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
        run: |
          # Install psql
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # Test connection with psql
          echo "Testing psql connection..."
          psql "$DATABASE_URL_POOLER" -c "SELECT 'psql direct works' as status;" || echo "psql failed with exit code $?"

      - name: Run Flex ingestion
        env:
          # Database connection (direct connection for IPv4 compatibility)
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}

          # IBKR Flex API credentials
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_POSITIONS_QUERY_ID: ${{ secrets.IBKR_FLEX_POSITIONS_QUERY_ID }}
          IBKR_FLEX_TRADES_QUERY_ID: ${{ secrets.IBKR_FLEX_TRADES_QUERY_ID }}
          IBKR_FLEX_BASE_URL: ${{ secrets.IBKR_FLEX_BASE_URL }}
          IBKR_FLEX_WAIT_MS: ${{ secrets.IBKR_FLEX_WAIT_MS }}
        run: |
          npx tsx scripts/run-flex-ingestion.ts

