name: Solana Ingestion

on:
  schedule:
    # Every 4 hours at :50 past the hour (offset from HL at :00, CBP at :15, Kraken at :30, Deribit at :45)
    - cron: '50 */4 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Solana ingestion
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_WALLETS: ${{ secrets.SOLANA_WALLETS }}
        run: npx tsx scripts/ingest-solana.ts
