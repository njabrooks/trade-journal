name: Coinbase Prime Ingestion

# Crypto markets are 24/7 — run every 4 hours
on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Coinbase Prime ingestion
        env:
          DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          USE_DIRECT_CONNECTION: ${{ secrets.USE_DIRECT_CONNECTION }}
          COINBASE_PRIME_ACCESS_KEY: ${{ secrets.COINBASE_PRIME_ACCESS_KEY }}
          COINBASE_PRIME_SIGNING_KEY: ${{ secrets.COINBASE_PRIME_SIGNING_KEY }}
          COINBASE_PRIME_PASSPHRASE: ${{ secrets.COINBASE_PRIME_PASSPHRASE }}
          COINBASE_PRIME_PORTFOLIO_ID: ${{ secrets.COINBASE_PRIME_PORTFOLIO_ID }}
        run: |
          npx tsx scripts/ingest-coinbase-prime.ts
